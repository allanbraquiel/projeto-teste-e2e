name: Trigger E2E GitHub

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger-e2e-github:
    runs-on: ubuntu-latest

    steps:
      - name: Disparar pipeline E2E no GitHub
        run: |
          curl --fail -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.E2E_REPO_TOKEN }}" \
          https://api.github.com/repos/allanbraquiel/testes-cypress-e2e/dispatches \
          -d '{"event_type":"run-e2e-tests"}'
